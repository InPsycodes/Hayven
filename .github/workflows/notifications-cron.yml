name: Notifications cron

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call notifications cron endpoint
        run: |
          status=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://hayven.com.ng/api/cron/notifications)
          cat /tmp/response.json
          if [ "$status" -ne 200 ]; then
            echo "Request failed with status $status"
            exit 1
          fi
