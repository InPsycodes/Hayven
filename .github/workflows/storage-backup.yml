name: Storage backup

on:
  schedule:
    # 02:00 UTC daily. PITR (once enabled) only covers the Postgres
    # database -- it does not restore Supabase Storage objects, so the
    # `credentials` (therapist verification docs) and `avatars` buckets need
    # their own backup path (AUD-09, external audit 2026-10-08).
    - cron: "0 2 * * *"
  workflow_dispatch: {}

concurrency:
  group: storage-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    # Skipped (not failed) until the eight secrets below are added under
    # Settings -> Secrets and variables -> Actions. STORAGE_BACKUP_R2_BUCKET
    # is just the sentinel checked here; all eight are required to actually
    # run (see the "Write rclone config" step).
    if: ${{ secrets.STORAGE_BACKUP_R2_BUCKET != '' }}
    steps:
      # IMPORTANT: unlike the integration-tests job in ci.yml, this backs up
      # PRODUCTION data on purpose -- credentials/avatars that real
      # therapists and parents uploaded live only in the production project
      # (ref cfzbhibpwcerbxgawxqi), not in the hayven_load_test throwaway
      # project. Do not point STORAGE_BACKUP_SUPABASE_ENDPOINT anywhere else.
      - name: Install rclone
        run: sudo apt-get update && sudo apt-get install -y rclone

      # Supabase Storage is S3-compatible (Dashboard -> Storage -> S3
      # Access Keys for the access key/secret, distinct from the service
      # role key). Credentials go in rclone.conf, not on the command line,
      # so they never appear in a `ps` listing or shell history on the
      # runner.
      - name: Write rclone config
        run: |
          mkdir -p ~/.config/rclone
          cat <<EOF > ~/.config/rclone/rclone.conf
          [supabase]
          type = s3
          provider = Other
          endpoint = ${{ secrets.STORAGE_BACKUP_SUPABASE_ENDPOINT }}
          region = ${{ secrets.STORAGE_BACKUP_SUPABASE_REGION }}
          access_key_id = ${{ secrets.STORAGE_BACKUP_SUPABASE_ACCESS_KEY_ID }}
          secret_access_key = ${{ secrets.STORAGE_BACKUP_SUPABASE_SECRET_ACCESS_KEY }}

          [r2]
          type = s3
          provider = Cloudflare
          endpoint = ${{ secrets.STORAGE_BACKUP_R2_ENDPOINT }}
          access_key_id = ${{ secrets.STORAGE_BACKUP_R2_ACCESS_KEY_ID }}
          secret_access_key = ${{ secrets.STORAGE_BACKUP_R2_SECRET_ACCESS_KEY }}
          EOF

      # Mirrors each bucket under its own prefix in the backup bucket.
      # `sync` (not `copy`) so a file deleted in Supabase also disappears
      # from the backup -- this is a mirror for disaster recovery, not a
      # version history. Add --backup-dir here later if point-in-time
      # recovery of individual deleted files becomes a requirement.
      - name: Sync credentials bucket
        run: rclone sync supabase:credentials r2:${{ secrets.STORAGE_BACKUP_R2_BUCKET }}/credentials --s3-no-check-bucket -v

      - name: Sync avatars bucket
        run: rclone sync supabase:avatars r2:${{ secrets.STORAGE_BACKUP_R2_BUCKET }}/avatars --s3-no-check-bucket -v
