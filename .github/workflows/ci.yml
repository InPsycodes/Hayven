name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # Placeholder values: `next build` only needs these to be syntactically
    # valid (URL parsing in next.config.ts, client creation in the module
    # graph). Dynamic pages that actually talk to Supabase are never executed
    # during a build, so no real project/keys are required here.
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
      NEXT_PUBLIC_SITE_URL: https://example.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # --omit=dev: only vulnerabilities actually reachable in the deployed
      # app (a devDependency like the test runner never ships). --audit-level
      # high: fails the build on High/Critical findings -- this is the check
      # that would have caught the Next.js next/og ImageResponse RCE
      # (GHSA-vcvr-r3jv-pc5j) automatically instead of needing a manual audit.
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

      # Build first: it generates next-env.d.ts (git-ignored, provides the
      # static-asset module declarations) and runs the TypeScript check, so a
      # bare `tsc` afterwards resolves image imports the same way the editor
      # does.
      - name: Build
        run: npx next build

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      - name: Test
        run: npm test

  # Runs against a real (throwaway, non-production) Supabase project --
  # test/integration/env.ts hard-fails unless the URL matches project ref
  # sfvwfbgrfmqaaakbepll (hayven_load_test), so these secrets must point at
  # that exact project (AUD-11, external audit 2026-10-08). Until
  # INTEGRATION_SUPABASE_URL is added under Settings -> Secrets and
  # variables -> Actions, every step after the check is skipped, so CI stays
  # green in the meantime.
  #
  # The gate is a shell step, not a job-level `if: secrets.X != ''`: GitHub
  # rejects the `secrets` context in `if:` ("Unrecognized named-value"),
  # which invalidates the whole workflow file -- the verify job included
  # (audit 2026-11-01; same pattern as storage-backup.yml).
  integration-tests:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.INTEGRATION_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.INTEGRATION_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.INTEGRATION_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Check secrets configured
        id: check
        run: |
          if [ -n "$NEXT_PUBLIC_SUPABASE_URL" ] && [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Integration test secrets not configured yet -- skipping (AUD-11)."
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.configured == 'true'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.configured == 'true'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: steps.check.outputs.configured == 'true'

      # env.ts reads credentials from a .env.test file on disk (gitignored
      # locally), not process.env directly -- write one from the job-level
      # secrets above so the existing loader finds what it expects, without
      # changing that file's hard-coded-project-ref safety check.
      - name: Write .env.test from secrets
        if: steps.check.outputs.configured == 'true'
        run: |
          cat <<EOF > .env.test
          NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL
          NEXT_PUBLIC_SUPABASE_ANON_KEY=$NEXT_PUBLIC_SUPABASE_ANON_KEY
          SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY
          EOF

      - name: Integration tests
        if: steps.check.outputs.configured == 'true'
        run: npm run test:integration
