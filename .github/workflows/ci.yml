name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # Placeholder values: `next build` only needs these to be syntactically
    # valid (URL parsing in next.config.ts, client creation in the module
    # graph). Dynamic pages that actually talk to Supabase are never executed
    # during a build, so no real project/keys are required here.
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
      NEXT_PUBLIC_SITE_URL: https://example.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # --omit=dev: only vulnerabilities actually reachable in the deployed
      # app (a devDependency like the test runner never ships). --audit-level
      # high: fails the build on High/Critical findings -- this is the check
      # that would have caught the Next.js next/og ImageResponse RCE
      # (GHSA-vcvr-r3jv-pc5j) automatically instead of needing a manual audit.
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

      # Build first: it generates next-env.d.ts (git-ignored, provides the
      # static-asset module declarations) and runs the TypeScript check, so a
      # bare `tsc` afterwards resolves image imports the same way the editor
      # does.
      - name: Build
        run: npx next build

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      - name: Test
        run: npm test
