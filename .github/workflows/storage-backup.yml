name: Storage backup

on:
  schedule:
    # 02:00 UTC daily. PITR (once enabled) only covers the Postgres
    # database -- it does not restore Supabase Storage objects, so the
    # `credentials` (therapist verification docs) and `avatars` buckets need
    # their own backup path (AUD-09, external audit 2026-10-08).
    - cron: "0 2 * * *"
  workflow_dispatch: {}

concurrency:
  group: storage-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    # IMPORTANT: unlike the integration-tests job in ci.yml, this backs up
    # PRODUCTION data on purpose -- credentials/avatars that real therapists
    # and parents uploaded live only in the production project (ref
    # cfzbhibpwcerbxgawxqi), not in the hayven_load_test throwaway project.
    # Do not point SUPABASE_ENDPOINT anywhere else.
    env:
      R2_BUCKET: ${{ secrets.STORAGE_BACKUP_R2_BUCKET }}
      R2_ENDPOINT: ${{ secrets.STORAGE_BACKUP_R2_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.STORAGE_BACKUP_R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.STORAGE_BACKUP_R2_SECRET_ACCESS_KEY }}
      SUPABASE_ENDPOINT: ${{ secrets.STORAGE_BACKUP_SUPABASE_ENDPOINT }}
      SUPABASE_REGION: ${{ secrets.STORAGE_BACKUP_SUPABASE_REGION }}
      SUPABASE_ACCESS_KEY_ID: ${{ secrets.STORAGE_BACKUP_SUPABASE_ACCESS_KEY_ID }}
      SUPABASE_SECRET_ACCESS_KEY: ${{ secrets.STORAGE_BACKUP_SUPABASE_SECRET_ACCESS_KEY }}
    steps:
      # The `secrets` context can't be referenced inside any `if:` condition
      # -- a job-level `if: secrets.X != ''` is rejected outright by the
      # GitHub Actions parser ("Unrecognized named-value: 'secrets'"), and a
      # step-level one is unreliable too. So: read the already-job-scoped
      # env vars above in a normal shell check instead, and gate every
      # later step on *this* step's output (the `steps` context, not
      # `secrets`, is fully supported in `if:`).
      - name: Check secrets configured
        id: check
        run: |
          if [ -n "$R2_BUCKET" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Storage backup secrets not configured yet -- skipping this run (AUD-09)."
          fi

      - name: Install rclone
        if: steps.check.outputs.configured == 'true'
        run: sudo apt-get update && sudo apt-get install -y rclone

      # Supabase Storage is S3-compatible (Dashboard -> Storage -> S3
      # Access Keys for the access key/secret, distinct from the service
      # role key). Credentials are read from the job's own env here, never
      # re-interpolated as `${{ secrets.X }}` into the run text -- that
      # avoids a secret's raw value ever being substituted into a shell
      # command string before the shell sees it.
      - name: Write rclone config
        if: steps.check.outputs.configured == 'true'
        run: |
          mkdir -p ~/.config/rclone
          cat <<EOF > ~/.config/rclone/rclone.conf
          [supabase]
          type = s3
          provider = Other
          endpoint = $SUPABASE_ENDPOINT
          region = $SUPABASE_REGION
          access_key_id = $SUPABASE_ACCESS_KEY_ID
          secret_access_key = $SUPABASE_SECRET_ACCESS_KEY

          [r2]
          type = s3
          provider = Cloudflare
          endpoint = $R2_ENDPOINT
          access_key_id = $R2_ACCESS_KEY_ID
          secret_access_key = $R2_SECRET_ACCESS_KEY
          EOF

      # Mirrors each bucket under its own prefix in the backup bucket.
      # `sync` (not `copy`) so a file deleted in Supabase also disappears
      # from the backup -- this is a mirror for disaster recovery, not a
      # version history. Add --backup-dir here later if point-in-time
      # recovery of individual deleted files becomes a requirement.
      #
      # --checksum: compares files by hash instead of size+modtime, so a
      # steady-state night (nothing changed) never needs the
      # set-modtime-after-upload call that hit "501 NotImplemented" against
      # R2 on the very first run (the object itself still wrote
      # successfully -- rclone's own retry recovered -- but that's a known
      # R2 S3-API gap worth not depending on every night). --retries/
      # --low-level-retries raised above rclone's defaults (3/10) so a
      # transient R2 hiccup doesn't fail a night's backup outright.
      - name: Sync credentials bucket
        if: steps.check.outputs.configured == 'true'
        run: rclone sync supabase:credentials "r2:$R2_BUCKET/credentials" --s3-no-check-bucket --checksum --retries 5 --low-level-retries 20 -v

      - name: Sync avatars bucket
        if: steps.check.outputs.configured == 'true'
        run: rclone sync supabase:avatars "r2:$R2_BUCKET/avatars" --s3-no-check-bucket --checksum --retries 5 --low-level-retries 20 -v
