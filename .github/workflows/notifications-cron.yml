name: Notifications cron (backstop)

# Primary scheduling is pg_cron inside Supabase (migration 0070) at */15.
# This workflow is a low-frequency safety net for if pg_cron / pg_net is
# ever wedged -- every cron task dedups its own work, so an extra run is
# harmless. GitHub scheduled runs are unreliable, which is exactly why
# they're no longer the primary path.

on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call notifications cron endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          TARGET_URL: ${{ vars.CRON_TARGET_URL || 'https://hayven.com.ng' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET secret is not set -- add it in repo settings > Secrets and variables > Actions."
            exit 1
          fi
          status=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${TARGET_URL}/api/cron/notifications")
          cat /tmp/response.json
          if [ "$status" -ne 200 ]; then
            echo "Request failed with status $status"
            exit 1
          fi
